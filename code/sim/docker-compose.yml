version: '3.8'

services:
  backend:
    build: ./backend
    container_name: btc-sim-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./btc_sim.db
    volumes:
      - ./backend/app:/app/app:ro  # Mount source for development auto-reload
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: ./web
    container_name: btc-sim-web
    ports:
      - "80:80"
    volumes:
      - ./web/src:/app/src:ro  # Mount source for development auto-reload
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-data:
