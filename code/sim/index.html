<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Meatspace Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Bitcoin Meatspace Simulator</h1>
            <p class="subtitle">Simulate Bitcoin transactions in physical space</p>
        </header>

        <div class="simulation-area">
            <div class="controls">
                <h2>Simulation Controls</h2>
                <div class="control-group">
                    <button id="addPerson" class="btn btn-primary">Add Person</button>
                    <button id="addMerchant" class="btn btn-success">Add Merchant</button>
                    <button id="reset" class="btn btn-danger">Reset</button>
                </div>
                <div class="control-group">
                    <button id="startTx" class="btn btn-warning">Start Transaction</button>
                    <button id="randomWalk" class="btn btn-info">Random Walk</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="simCanvas" width="800" height="600"></canvas>
            </div>

            <div class="stats">
                <h3>Statistics</h3>
                <div class="stat-grid">
                    <div class="stat-item">
                        <span class="stat-label">People:</span>
                        <span id="peopleCount" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Merchants:</span>
                        <span id="merchantCount" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Transactions:</span>
                        <span id="txCount" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total BTC:</span>
                        <span id="totalBtc" class="stat-value">0.000</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="transaction-log">
            <h3>Transaction Log</h3>
            <div id="logEntries" class="log-entries"></div>
        </div>

        <footer>
            <p>Click on the canvas to select entities • Use controls to simulate Bitcoin transactions</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
